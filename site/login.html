<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — AsyncAnalyzer</title>
<meta name="description" content="Sign in to your AsyncAnalyzer server dashboard.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<script>try{var t=localStorage.getItem('aa-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

<div id="nav"></div>

<main class="wrap narrow" style="padding-top:56px">
  <h2 style="margin-bottom:10px">Log in</h2>
  <p class="muted" style="margin-bottom:28px">Your server's scan history lives behind this.</p>

  <div id="error" hidden class="notice notice-bad" role="alert" style="margin-bottom:20px"></div>

  <div id="providers" class="btn-row" style="flex-direction:column">
    <a class="btn btn-primary" id="p-discord" style="width:100%" href="/auth/discord" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.3 5.3A16.9 16.9 0 0 0 15.1 4l-.2.4a15.7 15.7 0 0 1 3.7 1.2 12.8 12.8 0 0 0-11.2 0A15.7 15.7 0 0 1 11.1 4.4L10.9 4a16.9 16.9 0 0 0-4.2 1.3C4 9.3 3.3 13.2 3.6 17a17 17 0 0 0 5.2 2.6l.4-.6a11 11 0 0 1-1.7-.8l.4-.3a12.1 12.1 0 0 0 10.2 0l.4.3a11 11 0 0 1-1.7.8l.4.6a17 17 0 0 0 5.2-2.6c.4-4.4-.6-8.3-2.6-11.7zM9.5 14.7c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2zm5 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2z"/></svg>
      Continue with Discord
    </a>
    <a class="btn" id="p-google" style="width:100%" href="/auth/google" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.7h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.8V7.6H3.1a10 10 0 0 0 0 8.9L6.4 14z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.6l3.3 2.6C7.2 7.7 9.4 5.9 12 5.9z"/></svg>
      Continue with Google
    </a>
  </div>

  <div class="divider" id="or">or with email</div>

  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="hint"><a href="/forgot">Forgot your password?</a></div>
    </div>
    <button class="btn btn-primary" style="width:100%" type="submit">Log in</button>
  </form>

  <p class="muted small" style="margin-top:24px">
    No account yet? <a href="/signup">Create one</a> — then apply with your server.
  </p>
</main>

<div id="foot"></div>

<script type="module">
import { boot, api, me, $, toast } from '/assets/app.js';

boot(async () => {
  const next = new URLSearchParams(location.search).get('next') || '/app';
  const err = new URLSearchParams(location.search).get('error');
  if (err) { $('#error').textContent = err; $('#error').hidden = false; }

  const state = await me();
  if (state && state.user) { location.replace(next); return; }

  // Only offer a way in that is actually configured. A Google button that
  // bounces off a missing client id looks like the site is broken.
  const p = (state && state.providers) || {};
  if (p.discord) { const a = $('#p-discord'); a.href = '/auth/discord?next=' + encodeURIComponent(next); a.hidden = false; }
  if (p.google) { const a = $('#p-google'); a.href = '/auth/google?next=' + encodeURIComponent(next); a.hidden = false; }
  if (!p.discord && !p.google) $('#or').hidden = true;

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.setAttribute('aria-busy', 'true');
    try {
      await api('/api/auth/login', { body: { email: $('#email').value.trim(), password: $('#password').value } });
      location.replace(next);
    } catch (ex) {
      $('#error').textContent = ex.message;
      $('#error').hidden = false;
      $('#email').focus();
    } finally {
      btn.removeAttribute('aria-busy');
    }
  });
});
</script>
</body></html>
