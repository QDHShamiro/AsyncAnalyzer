# Public, continuous proof that detection still works.
#
# The failure mode that matters here is silent: a detector that starts flagging
# legitimate mods looks fine until someone gets accused. So this runs on every
# push, publishes the numbers where anyone can read them, and FAILS the build if
# a real library ever gets flagged by a cheat rule.
name: Benchmark

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'BENCHMARKS.md']
  pull_request:
  schedule:
    # Weekly: the corpus is fetched live from Maven Central, so this also catches
    # the case where a dependency changes underneath us.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Two overlapping runs both regenerate the same committed files and collide on the
# push. Serialise them; a queued run supersedes an older one because only the
# newest result is worth publishing.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 122 jars from Maven Central; cached so a normal run does not re-download.
      - name: Cache library corpus
        uses: actions/cache@v4
        with:
          path: ml/jars_legit
          key: jars-${{ hashFiles('ml/fetch_jars.py') }}

      - name: Fetch the real-library corpus
        run: python3 ml/fetch_jars.py

      - name: Test suites
        working-directory: ml
        run: |
          set -e
          for t in test_verdict test_selflearn test_session test_bytecode test_memory test_autoscan test_report test_macro test_logscan test_instscan test_sysscan test_histscan test_usnscan test_selftest_cases test_gates test_parallel; do
            echo "--- $t ---"
            python3 "$t.py"
          done
          # Not a test suite: a detector for signals that are measured and never
          # reach a decision. Those do not fail a test - the scan just quietly
          # scores lower than every suite above says it should.
          echo "--- dead-end audit ---"
          python3 audit.py

      # THE check this project went without for far too long. Everything else
      # here is a Python mirror of what the PowerShell is meant to do; none of it
      # can see a syntax error, and none of it runs a single line of the shipped
      # script. The first real Windows run died on a parse error - a $( ) holding
      # a double quote inside a double-quoted string - that every mirror, every
      # test and the brace counter had passed. ubuntu-latest ships pwsh.
      - name: PowerShell parses
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./AsyncAnalyzer.ps1), [ref]$null, [ref]$errs)
          if ($errs) {
            $errs | ForEach-Object { "{0}:{1}  {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message }
            exit 1
          }
          "no parse errors"

      # Parsing is not enough. PowerShell resolves a function call when it RUNS,
      # so a call reached before its "function Foo {}" line has executed dies at
      # runtime with "the term ... is not recognized" - and no parser, no test
      # and no Python mirror can see it coming. It shipped: Run-SystemChecks
      # called Test-CheatName, which was defined in a section that loaded after
      # the scan had already started. Running the tool here missed it too,
      # because that branch sits behind $env:SystemRoot, which is empty on Linux.
      - name: Every function exists before it is called
        shell: pwsh
        run: pwsh -File scripts/check-order.ps1

      # And then actually RUN it. The self-test exercises the model, the verdict
      # bands, the report renderer and the filename heuristics - the last of
      # which is where a real run found that 'aeiou' -contains $_ is always
      # False, so every legitimate mod outside a hand-written prefix list was
      # being floored to Review.
      # One script, run here and by hand, so the two cannot drift. It carries the
      # two details that decide whether this proves anything: *>&1 (the tool prints
      # through Write-Host, which 2>&1 cannot see) and the ErrorActionPreference
      # this step already runs under. Both were wrong at once, and between them the
      # step could only ever fail.
      - name: PowerShell self-test
        shell: pwsh
        run: pwsh -File scripts/selftest.ps1

      # Run it the way it is actually DELIVERED. The one-liner is
      # iex (irm ...), which evaluates in the caller's scope; -File creates a
      # script scope. A variable assigned unqualified at top level and read as
      # $script: inside a function lands in the same place under -File and NOT
      # under iex - so the scan died on the fourth jar with "you cannot call a
      # method on a null-valued expression" while every test here passed.
      - name: Runs the way it is delivered (iex, not -File)
        shell: pwsh
        run: |
          $mods = Join-Path ([System.IO.Path]::GetTempPath()) "aa-ci-mods"
          New-Item -ItemType Directory -Force -Path $mods | Out-Null
          Get-ChildItem ml/jars_legit -Filter *.jar -ErrorAction SilentlyContinue |
            Select-Object -First 4 | ForEach-Object { Copy-Item $_.FullName $mods }
          if (-not (Get-ChildItem $mods -Filter *.jar)) { "no corpus jars - skipping"; exit 0 }
          $sb = [scriptblock]::Create((Get-Content -Raw ./AsyncAnalyzer.ps1))
          $out = & $sb -Path $mods -NoUpdate -NoLearn -Yes -NoElevate *>&1 | Out-String
          $out
          if ($out -match 'InvokeMethodOnNull|null-valued expression|CommandNotFoundException') {
            "a runtime error the -File run would not have shown"; exit 1
          }

      # Two hand-maintained implementations of one API. They had already drifted -
      # the deployed half left scanId out of /api/history, which is the field the
      # report tells moderators to look up - so both are started for real and
      # asked the same questions.
      - name: Backend parity
        run: node server/test_parity.mjs

      # There is no PowerShell here, so the script cannot be parsed or run. This is
      # the closest thing to a compile check: it catches calls to functions that do
      # not exist, duplicate definitions (the later one silently wins) and
      # $script: variables that are read but never assigned.
      # The shipped script is assembled from src/. If someone edits AsyncAnalyzer.ps1
      # directly, the next build silently reverts it - so catch that here instead.
      - name: Shipped script matches its sources
        run: python3 build.py --check

      - name: PowerShell static checks
        run: python3 ml/ps_lint.py

      - name: PowerShell / Python model parity
        run: |
          python3 - <<'EOF'
          import re, json, sys
          ps = open('AsyncAnalyzer.ps1', encoding='utf-8').read()
          bad = []
          for name, path, var in (("mod", "ml/model.json", "ml"),
                                  ("session", "ml/session_model.json", "sm")):
              j = json.load(open(path))
              block = re.search(r"\$script:%sWeights = @\{\n(.*?)\n\}" % var, ps, re.S).group(1)
              w = {m.group(1): float(m.group(2))
                   for m in re.finditer(r"'([a-z_]+)' = (-?[\d.]+)", block)}
              for k in j['feature_order']:
                  if abs(w.get(k, 1e9) - j['weights'][k]) > 1e-9:
                      bad.append("%s model: %s" % (name, k))
          # the embedded weights must equal the trained ones, or the tool is not
          # running the model the repo documents
          print("parity OK" if not bad else "MISMATCH: %s" % bad)
          sys.exit(1 if bad else 0)
          EOF

      - name: Benchmark
        run: python3 ml/benchmark.py

      # The landing page and the rule documentation quote the numbers the
      # benchmark just measured, so they are rebuilt in the same step.
      - name: Build the site
        run: python3 ml/site.py

      - name: Publish the numbers to the run summary
        if: always()
        run: cat BENCHMARKS.md >> "$GITHUB_STEP_SUMMARY"

      # The numbers already reach two places that cannot run out of quota: the run
      # summary above and BENCHMARKS.md in the repo. So a full artifact store must
      # not be the thing that turns the build red - a permanently red build stops
      # being read, and then a real failure hides in it.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: benchmarks
          path: BENCHMARKS.md

      # Keep the committed results current so the repo never shows stale numbers.
      - name: Commit refreshed results
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- BENCHMARKS.md ml/benchmark_history.csv docs/; then
            echo "unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BENCHMARKS.md ml/benchmark_history.csv docs/
          git commit -m "Refresh benchmark results [skip ci]"
          # main can move while the benchmark runs (it takes ~2 min). Rebasing was
          # the first attempt at that and it is wrong: when two runs overlap, both
          # rewrite the same generated files and the rebase stops on a conflict that
          # nothing in CI can resolve, so the run fails having produced correct
          # results it then throws away.
          #
          # These files are a pure function of the sources, so there is nothing to
          # merge. Take whatever is on main now and regenerate on top of it - which
          # also means the published numbers describe the newest code rather than
          # the commit this run happened to start from.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python3 ml/benchmark.py || exit 1
            python3 ml/site.py || exit 1
            git add BENCHMARKS.md ml/benchmark_history.csv docs/
            if git diff --cached --quiet; then
              echo "already current on main"
              exit 0
            fi
            git commit -m "Refresh benchmark results [skip ci]"
            sleep $((i * 3))
          done
          echo "could not push benchmark results" >&2
          exit 1
