# Publishes the public site.
#
# Pages has to be switched on once by hand (Settings -> Pages -> Source -> GitHub
# Actions). The workflow tries to do it through the API, but creating a Pages site
# with the workflow token is not permitted by default. Until someone flips that
# switch this run SUCCEEDS with a warning rather than failing: a workflow that is
# permanently red for something waiting on a human teaches people to ignore red,
# and then a real failure goes unnoticed too.
name: Site

on:
  push:
    branches: [main]
  # The benchmark commits refreshed numbers with [skip ci], which would skip this
  # workflow too and leave the site showing stale figures. Redeploy when it finishes.
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run replaces an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # The pages are generated, never hand-written: the landing page quotes the
      # measured numbers and the rule documentation is read out of the shipped
      # source, so neither can drift from what the tool actually does.
      - name: Build the site
        run: python3 ml/site.py

      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Say how to switch Pages on
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages is off::The site built fine. Turn Pages on once: Settings -> Pages -> Source -> GitHub Actions."
          {
            echo "## The site is built. Pages is not switched on yet."
            echo
            echo "This workflow cannot switch it on by itself - creating a Pages site with the"
            echo 'workflow token returns `Resource not accessible by integration`.'
            echo
            echo "**One click, once:**"
            echo
            echo "Settings -> Pages -> Build and deployment -> Source -> **GitHub Actions**"
            echo
            echo "Every push after that deploys automatically. This run is green because"
            echo "nothing is broken - it is waiting on that one setting."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
